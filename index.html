<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T20 RPG - Sistema Personalizado</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone para transpilar JSX no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .t20-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; }
    .t20-btn-primary { background-color: #dc2626; color: white; transition: all 0.2s; }
    .t20-btn-primary:hover { background-color: #b91c1c; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    @media print {
      body { background-color: white !important; color: black !important; }
      .no-print { display: none !important; }
      .t20-card { background-color: white !important; border: 1px solid #ccc !important; color: black !important; box-shadow: none !important; }
      .print-black { color: black !important; }
      .print-border { border-color: #ccc !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">

    // --- LISTA DE IDIOMAS DISPONÍVEIS ---

    // --- LISTA DE KITS DE FERRAMENTAS ---
    const TOOL_KITS = [

    // --- LISTA DE ORIGENS ---
    const ORIGINS = {

    // --- ESTRUTURA DE RAÇAS COM SUPORTE A SUBRAÇAS ---
    const RACES = {
      Humano: {

        hasSubRaces: true,
        subRaceLabel: "Clã Anão",
        subRaces: [
          {
            id: "anao_pedra",

            extraMods: { CON: 0 },

          {

      },
      Ínfero: {
        desc: "Uma mutação genética faz com que, alguns.",
        mods: { FOR: 0, DES: 1, CON: 0, INT: 1, SAB: -1, CAR: 1 },
        traits: [
          { name: "Herança Sombria", desc: "Começam com 1 vaga extra para escolher um Poder Ínfero." }
        ],
        powerSlotsBonus: { Geral: 1, Arcano: 0, Divino: 0, Ínfero: 1 },
        resistances: { Fogo: 5 },
        hasSubRaces: true,
        subRaceLabel: "Linhagem Diabólica",
        subRaces: [
          {
            id: "infero_chamas",
            name: "Linhagem das Chamas",
            desc: "Seu sangue arde com o calor do abismo.",
            extraMods: { CAR: 1 },
            extraTrait: { name: "Aura Incandescente", desc: "+2 de Resistência a Fogo extra." },
            extraResistances: { Fogo: 2 }
          },
          {
            id: "infero_sombras",
            name: "Linhagem das Sombras",
            desc: "Passos silenciosos e afinidade com o plano das sombras.",
            extraMods: { DES: 1 },
            extraTrait: { name: "Passo Obscuro", desc: "+2 em testes de Furtividade." },
            extraResistances: {}
          }
        ]
      },
      Tritão: {
        desc: "Povo místico das profundezas com voz encantadora.",
        mods: { FOR: 0, DES: 1, CON: 0, INT: 0, SAB: 0, CAR: 2 },
        traits: [
          { name: "Canção do Mar", desc: "Permite conjurar a habilidade Sono utilizando CARISMA (CAR)." }
        ],
        powerSlotsBonus: { Geral: 1, Arcano: 0, Divino: 0, Ínfero: 0 },
        resistances: { Frio: 5 },
        hasSubRaces: false
      }
    };

    // --- ESTRUTURA DE CLASSES COM ESCOLHA DINÂMICA DE COMPETÊNCIAS ---
    const CLASSES = {
      Guerreiro: {
        keyAttr: null, // Marcial
        basePV: 20, basePM: 3,
        competencyChoiceCount: 2,
        availableCompetencies: ["Atletismo", "Luta", "Adestramento", "Cavalar", "Pontaria", "Intimidação"],
        defensesConfig: { Fortitude: 2, Reflexos: 1, Vontade: 0 },
        attacksConfig: { Luta: 2, Pontaria: 1 },
        powerSlotsBonus: { Geral: 0, Arcano: 0, Divino: 0, Ínfero: 0 },
        startingEquipment: [
          { category: "Arma", name: "Espada Longa (1d8 cortante)" },
          { category: "Armadura", name: "Cota de Malha (+5 Defesa)" }
        ],
        abilities: [
          { name: "Ataque Especial", desc: "Gaste 1 PM para somar +4 no teste de ataque ou dano (Usa FOR)." },
          { name: "Durão", desc: "Reação (2 PM): reduz o dano sofrido pela metade." }
        ]
      },
      Feiticeiro: {
        keyAttr: "INT", // Conjurador Arcano
        basePV: 8, basePM: 6,
        competencyChoiceCount: 2,
        availableCompetencies: ["Misticismo", "Conhecimento", "Enganação", "Investigação", "Atuação"],
        defensesConfig: { Vontade: 2, Reflexos: 1, Fortitude: 0 },
        attacksConfig: { Luta: 0, Pontaria: 1 },
        powerSlotsBonus: { Geral: 0, Arcano: 1, Divino: 0, Ínfero: 0 },
        startingEquipment: [
          { category: "Arma", name: "Cajado Arcano (1d6 impacto)" },
          { category: "Armadura", name: "Manto de Proteção (+1 Defesa)" }
        ],
        subChoiceLabel: "Linhagem Elemental",
        subChoices: [
          { id: "fogo", name: "Fogo", attackName: "Raio Flamejante", attackDesc: "Ataque à distância causando 1d6 de dano de Fogo e incendiando o alvo." },
          { id: "gelo", name: "Gelo", attackName: "Lança de Gelo", attackDesc: "Ataque à distância causando 1d6 de dano de Frio e reduzindo deslocamento em -3m." },
          { id: "trovao", name: "Trovão", attackName: "Choque Elétrico", attackDesc: "Ataque à distância causando 1d6 de dano Elétrico e atordoando em acerto crítico." }
        ],
        abilities: [
          { name: "Conjuração Arcana", desc: "Lança magias arcanas utilizando seu Modificador Chave de INTELIGÊNCIA (INT)." }
        ]
      },
      Clérigo: {
        keyAttr: "SAB", // Conjurador Divino
        basePV: 16, basePM: 5,
        competencyChoiceCount: 2,
        availableCompetencies: ["Religião", "Cura", "Diplomacia", "Intuição", "Conhecimento"],
        defensesConfig: { Vontade: 2, Fortitude: 1, Reflexos: 0 },
        attacksConfig: { Luta: 1, Pontaria: 0 },
        powerSlotsBonus: { Geral: 0, Arcano: 0, Divino: 1, Ínfero: 0 },
        startingEquipment: [
          { category: "Arma", name: "Maça Divina (1d8 impacto)" },
          { category: "Armadura", name: "Escudo Pesado (+2 Defesa)" }
        ],
        abilities: [
          { name: "Devoto Fiel", desc: "Canaliza milagres divinos utilizando seu Modificador Chave de SABEDORIA (SAB)." }
        ]
      }
    };

    // --- BANCO DE PODERES ---
    const POWERS_DATABASE = {
      Geral: [
        { id: 'g1', name: 'Ataque Poderoso', desc: '-2 no ataque para causar +5 de dano corpo a corpo.' },
        { id: 'g2', name: 'Esquiva', desc: '+2 na Defesa e em testes de Reflexos.' },
        { id: 'g3', name: 'Vontade de Ferro', desc: '+2 em testes de Vontade e +1 PM por nível.' },
        { id: 'g4', name: 'Vitalidade', desc: '+1d8 de PV adicionais e +2 em testes de Fortitude.' },
        { id: 'g5', name: 'Pele Tenaz', desc: 'Concede +3 de Resistência a Cortante e Impacto.', resistanceBonus: { Cortante: 3, Impacto: 3 } }
      ],
      Arcano: [
        { id: 'a1', name: 'Magia Expandida', desc: 'Aumenta o alcance de suas magias em um passo.' },
        { id: 'a2', name: 'Foco em Mana', desc: 'Reduz o custo de magias em -1 PM.' },
        { id: 'a3', name: 'Escudo Elemental', desc: 'Concede +5 de Resistência a Elétrico.', resistanceBonus: { Elétrico: 5 } }
      ],
      Divino: [
        { id: 'd1', name: 'Benção dos Céus', desc: '+2 em testes de Diplomacia e Cura.' },
        { id: 'd2', name: 'Escudo da Fé', desc: 'Reação (1 PM): Concede +2 em Defesa.' },
        { id: 'd3', name: 'Aura Espiritual', desc: 'Concede +5 de Resistência Espiritual.', resistanceBonus: { Espiritual: 5 } }
      ],
      Ínfero: [
        { id: 'i1', name: 'Sangue Fervente', desc: 'Resistência a Fogo 5 e +2 em Intimidação.', resistanceBonus: { Fogo: 5 } },
        { id: 'i2', name: 'Garras das Sombras', desc: 'Ataques desarmados causam dano cortante.' }
      ]
    };

    function App() {
      const [activeTab, setActiveTab] = useState('saved');
      const [isCreatingNew, setIsCreatingNew] = useState(false);
      const [step, setStep] = useState(1);
      const STANDARD_ARRAY = [16, 14, 12, 10, 10, 8];
      const [showRulesModal, setShowRulesModal] = useState(false); // Estado para controlar a visibilidade do modal de Regras
      const [activeRulesTab, setActiveRulesTab] = useState('Combate'); // Pode iniciar em 'Combate' ou 'Ficha'
      const [savedCharacters, setSavedCharacters] = useState(() => {
        try {
          const local = localStorage.getItem('rpg_characters');
          return local ? JSON.parse(local) : [];
        } catch(e) { return []; }
      });
      const [editingId, setEditingId] = useState(null);
      const [name, setName] = useState('');
      const [selectedRace, setSelectedRace] = useState('Humano');
      const [selectedSubRace, setSelectedSubRace] = useState('');
      const [selectedOrigin, setSelectedOrigin] = useState('Aethelgard (Capital do Sol)');
      const [selectedClass, setSelectedClass] = useState('Guerreiro');
      const [selectedSubChoice, setSelectedSubChoice] = useState('');
      const [selectedClassCompetencies, setSelectedClassCompetencies] = useState([]);
      const [attributes, setAttributes] = useState({ FOR: 16, DES: 14, CON: 12, INT: 10, SAB: 10, CAR: 8 });
      const [baseSkillCategories, setBaseSkillCategories] = useState({});
      const [skillCategories, setSkillCategories] = useState({});
      const [baseDefenseCategories, setBaseDefenseCategories] = useState({ Fortitude: 0, Reflexos: 0, Vontade: 0 });
      const [defenseCategories, setDefenseCategories] = useState({ Fortitude: 0, Reflexos: 0, Vontade: 0 });
      const [baseAttackCategories, setBaseAttackCategories] = useState({ Luta: 0, Pontaria: 0 });
      const [attackCategories, setAttackCategories] = useState({ Luta: 0, Pontaria: 0 });
      const [boughtLanguages, setBoughtLanguages] = useState([]);
      const [toolCategories, setToolCategories] = useState({});
      const [selectedPowers, setSelectedPowers] = useState({
        Geral: [], Arcano: [], Divino: [], Ínfero: []
      });
      const [equipment, setEquipment] = useState([]);
      const [newItemName, setNewItemName] = useState('');
      const [newItemCat, setNewItemCat] = useState('Arma');
      const [powerCategoryTab, setPowerCategoryTab] = useState('Geral');
      const [warningMessage, setWarningMessage] = useState(null);

      // ABA O MUNDO
      const [worldSubTab, setWorldSubTab] = useState('overview');

      // Atualizações de Raça / Subraça
      useEffect(() => {
        const raceObj = RACES[selectedRace];
        if (raceObj && raceObj.hasSubRaces && raceObj.subRaces.length > 0) {
          if (!selectedSubRace || !raceObj.subRaces.some(sr => sr.id === selectedSubRace)) {
            setSelectedSubRace(raceObj.subRaces[0].id);
          }
        } else {
          setSelectedSubRace('');
        }
      }, [selectedRace]);

      // Atualizações de Classe e Origem
      useEffect(() => {
        const cls = CLASSES[selectedClass];
        const orig = ORIGINS[selectedOrigin];
        if (cls && orig) {
          if (cls.subChoices && cls.subChoices.length > 0) {
            if (!selectedSubChoice || !cls.subChoices.some(sc => sc.id === selectedSubChoice)) {
              setSelectedSubChoice(cls.subChoices[0].id);
            }
          } else {
            setSelectedSubChoice('');
          }

          if (selectedClassCompetencies.length === 0 && cls.availableCompetencies) {
            setSelectedClassCompetencies(cls.availableCompetencies.slice(0, cls.competencyChoiceCount));
          }

          const initialEquip = [
            ...(cls.startingEquipment || []),
            ...(orig.items || [])
          ];
          setEquipment(initialEquip);
        }
      }, [selectedClass, selectedOrigin]);

      // Atualização dos Treinos Base (Perícias de Classe Escolhidas + Origem)
      useEffect(() => {
        const orig = ORIGINS[selectedOrigin];
        const bSkills = {};
        SKILLS_LIST.forEach(s => { bSkills[s.name] = 0; });
        
        selectedClassCompetencies.forEach(sc => {
          bSkills[sc] = Math.min(5, (bSkills[sc] || 0) + 1);
        });

        if (orig && orig.skillBonus) {
          bSkills[orig.skillBonus] = Math.min(5, (bSkills[orig.skillBonus] || 0) + 1);
        }

        setBaseSkillCategories(bSkills);

        setSkillCategories(prev => {
          const updated = { ...bSkills };
          Object.keys(prev).forEach(k => {
            if (prev[k] > updated[k]) updated[k] = prev[k];
          });
          return updated;
        });

        const cls = CLASSES[selectedClass];
        if (cls) {
          const bDefs = cls.defensesConfig || { Fortitude: 0, Reflexos: 0, Vontade: 0 };
          setBaseDefenseCategories(bDefs);
          setDefenseCategories(prev => ({ ...bDefs, ...prev }));

          const bAtks = cls.attacksConfig || { Luta: 0, Pontaria: 0 };
          setBaseAttackCategories(bAtks);
          setAttackCategories(prev => ({ ...bAtks, ...prev }));
        }
      }, [selectedClassCompetencies, selectedOrigin, selectedClass]);

      useEffect(() => {
        try {
          localStorage.setItem('rpg_characters', JSON.stringify(savedCharacters));
        } catch(e) {}
      }, [savedCharacters]);

      const calcMod = (val) => Math.floor((val - 10) / 2);
      
      // Cálculo dos Atributos
      const getFinalAttr = (attr) => attributes[attr];

      const getMod = (attr) => calcMod(getFinalAttr(attr));
      
      const classKeyAttr = CLASSES[selectedClass]?.keyAttr || null;
      const classKeyMod = classKeyAttr ? getMod(classKeyAttr) : null;

      const totalPV = (CLASSES[selectedClass]?.basePV || 0) + getMod('CON');
      const totalPM = (CLASSES[selectedClass]?.basePM || 0) + getMod('INT');
      
      const getPowerCategoryMaxSlots = (category) => {
        const raceSlots = RACES[selectedRace]?.powerSlotsBonus?.[category] || 0;
        const classSlots = CLASSES[selectedClass]?.powerSlotsBonus?.[category] || 0;
        return raceSlots + classSlots;
      };

      const calculateResistances = () => {
        const res = { Cortante: 0, Impacto: 0, Fogo: 0, Frio: 0, Elétrico: 0, Espiritual: 0 };
        const raceRes = RACES[selectedRace]?.resistances || {};
        Object.keys(raceRes).forEach(k => { res[k] += raceRes[k]; });

        const raceObj = RACES[selectedRace];
        if (raceObj?.hasSubRaces) {
          const subObj = raceObj.subRaces.find(sr => sr.id === selectedSubRace);
          if (subObj && subObj.extraResistances) {
            Object.keys(subObj.extraResistances).forEach(k => {
              res[k] = (res[k] || 0) + subObj.extraResistances[k];
            });
          }
        }

        Object.keys(selectedPowers).forEach(cat => {
          selectedPowers[cat].forEach(powId => {
            const pow = POWERS_DATABASE[cat]?.find(p => p.id === powId);
            if (pow && pow.resistanceBonus) {
              Object.keys(pow.resistanceBonus).forEach(k => {
                res[k] = (res[k] || 0) + pow.resistanceBonus[k];
              });
            }
          });
        });
        return res;
      };

      const resistances = calculateResistances();

      // PONTOS DE INTELIGÊNCIA GASTOS
      const intMod = getMod('INT');
      const intBonusPoints = Math.max(0, intMod);

      const calculateSpentPoints = (currents, bases) => {
        let spent = 0;
        Object.keys(currents).forEach(k => {
          const diff = (currents[k] || 0) - (bases[k] || 0);
          if (diff > 0) spent += diff;
        });
        return spent;
      };

      const spentSkills = calculateSpentPoints(skillCategories, baseSkillCategories);
      const spentDefs = calculateSpentPoints(defenseCategories, baseDefenseCategories);
      const spentAtks = calculateSpentPoints(attackCategories, baseAttackCategories);
      const spentLangs = boughtLanguages.length;
      const spentTools = Object.values(toolCategories).reduce((acc, lvl) => acc + (lvl || 0), 0);

      const totalSpentPoints = spentSkills + spentDefs + spentAtks + spentLangs + spentTools;
      const remainingIntPoints = intBonusPoints - totalSpentPoints;

      const togglePower = (category, powerId) => {
        setWarningMessage(null);
        const list = selectedPowers[category] || [];
        const isSelected = list.includes(powerId);

        if (isSelected) {
          setSelectedPowers(prev => ({
            ...prev,
            [category]: list.filter(id => id !== powerId)
          }));
        } else {
          const maxSlots = getPowerCategoryMaxSlots(category);
          if (list.length >= maxSlots) {
            setWarningMessage(`Você só possui ${maxSlots} vaga(s) para Poderes ${category}s!`);
            return;
          }
          setSelectedPowers(prev => ({
            ...prev,
            [category]: [...list, powerId]
          }));
        }
      };

      const handleCategoryChange = (type, key, newVal) => {
        setWarningMessage(null);
        let currents, bases, setter;

        if (type === 'skill') { currents = skillCategories; bases = baseSkillCategories; setter = setSkillCategories; }
        else if (type === 'defense') { currents = defenseCategories; bases = baseDefenseCategories; setter = setDefenseCategories; }
        else if (type === 'attack') { currents = attackCategories; bases = baseAttackCategories; setter = setAttackCategories; }

        const oldVal = currents[key] || 0;
        const baseVal = bases[key] || 0;

        if (newVal < baseVal) return;

        const diffChange = newVal - oldVal;
        if (diffChange > 0 && diffChange > remainingIntPoints) {
          setWarningMessage(`Pontos de Inteligência insuficientes para subir "${key}"!`);
          return;
        }

        setter(prev => ({ ...prev, [key]: newVal }));
      };

      const toggleExtraLanguage = (lang) => {
        setWarningMessage(null);
        if (boughtLanguages.includes(lang)) {
          setBoughtLanguages(prev => prev.filter(l => l !== lang));
        } else {
          if (remainingIntPoints < 1) {
            setWarningMessage("Pontos de Inteligência insuficientes para aprender um novo idioma!");
            return;
          }
          setBoughtLanguages(prev => [...prev, lang]);
        }
      };

      const handleToolCategoryChange = (toolName, newCatLevel) => {
        setWarningMessage(null);
        const oldCatLevel = toolCategories[toolName] || 0;
        if (newCatLevel < 0 || newCatLevel > 5) return;

        const diffChange = newCatLevel - oldCatLevel;
        if (diffChange > 0 && diffChange > remainingIntPoints) {
          setWarningMessage(`Pontos de Inteligência insuficientes para elevar a categoria do "${toolName}"!`);
          return;
        }

        setToolCategories(prev => ({ ...prev, [toolName]: newCatLevel }));
      };

      const toggleClassCompetency = (comp) => {
        const limit = CLASSES[selectedClass]?.competencyChoiceCount || 2;
        if (selectedClassCompetencies.includes(comp)) {
          setSelectedClassCompetencies(prev => prev.filter(c => c !== comp));
        } else {
          if (selectedClassCompetencies.length >= limit) {
            alert(`Você só pode escolher até ${limit} competências de classe!`);
            return;
          }
          setSelectedClassCompetencies(prev => [...prev, comp]);
        }
      };

      const getDefenseValue = (type, attrName) => {
        const catLevel = defenseCategories[type] || 0;
        const profBonus = COMPETENCY_LEVELS[catLevel].bonus;
        const attrMod = getMod(attrName);
        let powerBonus = 0;
        if (type === 'Reflexos' && selectedPowers.Geral?.includes('g2')) powerBonus += 2;
        if (type === 'Vontade' && selectedPowers.Geral?.includes('g3')) powerBonus += 2;
        if (type === 'Fortitude' && selectedPowers.Geral?.includes('g4')) powerBonus += 2;
        return 8 + profBonus + attrMod + powerBonus;
      };

      const finalFortitude = getDefenseValue('Fortitude', 'CON');
      const finalReflexos = getDefenseValue('Reflexos', 'DES');
      const finalVontade = getDefenseValue('Vontade', 'SAB');

      const getAttackValue = (type, attrName) => {
        const catLevel = attackCategories[type] || 0;
        const profBonus = COMPETENCY_LEVELS[catLevel].bonus;
        const attrMod = getMod(attrName);
        return profBonus + attrMod;
      };

      const finalLuta = getAttackValue('Luta', 'FOR');
      const finalPontaria = getAttackValue('Pontaria', 'DES');

      const addEquipmentItem = () => {
        if (!newItemName.trim()) return;
        setEquipment(prev => [...prev, { category: newItemCat, name: newItemName.trim() }]);
        setNewItemName('');
      };

      const removeEquipmentItem = (index) => {
        setEquipment(prev => prev.filter((_, i) => i !== index));
      };

      const handleExportData = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(savedCharacters, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `fichas_rpg_backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const handleImportData = (e) => {
        const fileReader = new FileReader();
        if (e.target.files && e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = (event) => {
            try {
              const imported = JSON.parse(event.target.result);
              if (Array.isArray(imported)) {
                setSavedCharacters(imported);
                alert(`${imported.length} ficha(s) importada(s) com sucesso!`);
              } else {
                alert("O arquivo importado é inválido!");
              }
            } catch (err) {
              alert("Erro ao ler arquivo JSON!");
            }
          };
        }
      };

      const handleSaveCharacter = () => {
        const charData = {
          id: editingId || Date.now().toString(),
          name: name || 'Personagem Sem Nome',
          selectedRace,
          selectedSubRace,
          selectedOrigin,
          selectedClass,
          selectedSubChoice,
          selectedClassCompetencies,
          attributes,
          skillCategories,
          defenseCategories,
          attackCategories,
          selectedPowers,
          equipment,
          boughtLanguages,
          toolCategories,
          resistances,
          totalPV,
          totalPM,
          finalFortitude,
          finalReflexos,
          finalVontade,
          finalLuta,
          finalPontaria
        };

        if (editingId) {
          setSavedCharacters(prev => prev.map(c => c.id === editingId ? charData : c));
        } else {
          setSavedCharacters(prev => [...prev, charData]);
        }
        setEditingId(charData.id);
        setIsCreatingNew(false);
        setActiveTab('saved');
        alert('Ficha salva com sucesso!');
      };

      const handleLoadCharacter = (char) => {
        setEditingId(char.id);
        setName(char.name);
        setSelectedRace(char.selectedRace);
        setSelectedSubRace(char.selectedSubRace || '');
        setSelectedOrigin(char.selectedOrigin || 'Aethelgard (Capital do Sol)');
        setSelectedClass(char.selectedClass);
        setSelectedSubChoice(char.selectedSubChoice || '');
        setSelectedClassCompetencies(char.selectedClassCompetencies || []);
        setAttributes(char.attributes);
        setSkillCategories(char.skillCategories || {});
        setDefenseCategories(char.defenseCategories || { Fortitude: 0, Reflexos: 0, Vontade: 0 });
        setAttackCategories(char.attackCategories || { Luta: 0, Pontaria: 0 });
        setSelectedPowers(char.selectedPowers || { Geral: [], Arcano: [], Divino: [], Ínfero: [] });
        setEquipment(char.equipment || []);
        setBoughtLanguages(char.boughtLanguages || []);
        setToolCategories(char.toolCategories || char.improvedTools || {});
        setIsCreatingNew(true);
        setStep(7);
      };

      const handleNewCharacter = () => {
        setEditingId(null);
        setName('');
        setSelectedRace('Humano');
        setSelectedSubRace('');
        setSelectedOrigin('Aethelgard (Capital do Sol)');
        setSelectedClass('Guerreiro');
        setSelectedSubChoice('');
        setSelectedClassCompetencies([]);
        setAttributes({ FOR: 10, DES: 10, CON: 10, INT: 10, SAB: 10, CAR: 10 });
        setSelectedPowers({ Geral: [], Arcano: [], Divino: [], Ínfero: [] });
        setEquipment([]);
        setBoughtLanguages([]);
        setToolCategories({});
        setIsCreatingNew(true);
        setStep(1);
      };

      const handleDeleteCharacter = (id) => {
        if (confirm('Deseja excluir este personagem?')) {
          setSavedCharacters(prev => prev.filter(c => c.id !== id));
          if (editingId === id) setIsCreatingNew(false);
        }
      };

      const activeSubChoiceObj = CLASSES[selectedClass]?.subChoices?.find(sc => sc.id === selectedSubChoice);
      const activeSubRaceObj = RACES[selectedRace]?.hasSubRaces ? RACES[selectedRace].subRaces.find(sr => sr.id === selectedSubRace) : null;



      return (
        <div className="min-h-screen flex flex-col max-w-5xl mx-auto p-3 sm:p-4 md:p-6">
          <header className="flex flex-col md:flex-row justify-between items-center pb-4 md:pb-6 mb-4 md:mb-6 border-b border-slate-800 gap-4 no-print">
            <div>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-red-500 flex items-center gap-2">
                🛡️ HUB T20 RPG
              </h1>
              <p className="text-slate-400 text-xs sm:text-sm">Sistema de RPG com Regras Completas e Fichas Detalhadas</p>
            </div>
            
            <nav className="flex flex-wrap w-full md:w-auto justify-center gap-2 bg-slate-800 p-1.5 rounded-xl">
              <button onClick={() => { setActiveTab('saved'); setIsCreatingNew(false); }} className={`px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all ${activeTab === 'saved' && !isCreatingNew ? 'bg-red-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                📋 Minhas Fichas ({savedCharacters.length})
              </button>
              <button
	      onClick={() => setShowRulesModal(true)}
              className="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold transition-all border border-slate-700">
                📖 Regras
              </button>
              <button onClick={() => setActiveTab('world')} className={`px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all ${activeTab === 'world' ? 'bg-red-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                🌍 O Mundo
              </button>
            </nav>
          </header>

          {activeTab === 'saved' && (
            <div>
              {!isCreatingNew ? (
                <div className="t20-card p-4 sm:p-6 space-y-4">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-800 pb-4 gap-3">
                    <div>
                      <h2 className="text-xl sm:text-2xl font-black text-red-500">Minhas Fichas de Personagem</h2>
                      <p className="text-xs text-slate-400">Crie, edite e gerencie todas as suas fichas</p>
                    </div>

                    <div className="flex flex-wrap gap-2 w-full sm:w-auto">
                      <button onClick={handleExportData} className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-lg border border-slate-700 transition-all flex items-center gap-1.5">
                        📤 Exportar Fichas
                      </button>
                      <label className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-lg border border-slate-700 transition-all cursor-pointer flex items-center gap-1.5">
                        📥 Importar JSON
                        <input type="file" accept=".json" onChange={handleImportData} className="hidden" />
                      </label>
                      <button onClick={handleNewCharacter} className="t20-btn-primary px-4 py-2 rounded-lg text-xs sm:text-sm font-bold flex items-center justify-center gap-2">
                        ➕ Criar Novo
                      </button>
                    </div>
                  </div>

                  {savedCharacters.length === 0 ? (
                    <div className="text-center py-12 bg-slate-900/50 border border-slate-800 rounded-xl space-y-3">
                      <p className="text-slate-400 text-sm">Nenhum personagem criado ainda.</p>
                      <button onClick={handleNewCharacter} className="t20-btn-primary px-4 py-2 rounded-lg text-xs font-bold inline-block">
                        Começar a Criar Ficha
                      </button>
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {savedCharacters.map((char) => (
                        <div key={char.id} className="p-4 bg-slate-900 rounded-xl border border-slate-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                          <div>
                            <h3 className="font-bold text-slate-100 text-lg">{char.name}</h3>
                            <p className="text-xs text-slate-400">
                              {char.selectedRace} {char.selectedSubRace ? `(${char.selectedSubRace})` : ''} - {char.selectedClass}
                            </p>
                            <div className="text-xs text-slate-500 mt-2 flex gap-4">
                              <span className="text-red-400 font-semibold">PV: {char.totalPV}</span>
                              <span className="text-blue-400 font-semibold">PM: {char.totalPM}</span>
                            </div>
                          </div>
                          <div className="flex w-full sm:w-auto gap-2">
                            <button onClick={() => handleLoadCharacter(char)} className="flex-1 sm:flex-none px-3 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-lg transition-all">
                              ✏️ Abrir / Editar
                            </button>
                            <button onClick={() => handleDeleteCharacter(char.id)} className="px-3 py-2 bg-red-950 hover:bg-red-900 text-red-400 text-xs font-bold rounded-lg border border-red-800 transition-all">
                              🗑️
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              ) : (
                /* PASSO A PASSO DO CRIADOR */
                <div className="space-y-4">
                  <div className="flex justify-between items-center bg-slate-900 p-3 rounded-lg border border-slate-800 no-print">
                    <span className="text-xs font-bold text-slate-300">
                      {editingId ? `Editando Ficha: ${name || 'Sem nome'}` : 'Criando Nova Ficha'}
                    </span>
                    <button onClick={() => setIsCreatingNew(false)} className="text-xs font-bold text-slate-400 hover:text-white px-2 py-1 bg-slate-800 rounded">
                      ❌ Voltar para a Lista
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div className="md:col-span-2 space-y-4">
                      {/* Passos */}
                      <div className="flex overflow-x-auto gap-1 bg-slate-800/60 p-2 rounded-lg border border-slate-700 custom-scrollbar no-print">
                        {['1. Raça', '2. Origem', '3. Classe', '4. Atributos', '5. Poderes', '6. Perícias & Treinos', '7. Resumo'].map((lbl, idx) => (
                          <button 
                            key={idx} 
                            onClick={() => setStep(idx + 1)}
                            className={`text-xs font-bold px-3 py-1.5 rounded whitespace-nowrap transition-all ${step === idx + 1 ? 'bg-red-500/20 text-red-400 border border-red-500/40' : 'text-slate-400 hover:text-slate-200'}`}>
                            {lbl}
                          </button>
                        ))}
                      </div>

                      {/* Passo 1: Raça + Suporte a Subraças */}
{step === 1 && (
  <div className="t20-card p-4 sm:p-5 space-y-4">
    <h2 className="text-xl font-bold text-slate-100">1. Escolha sua Raça</h2>
    
    {/* Botões de Raça Base (sem onMouseEnter / onMouseLeave) */}
    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
      {Object.keys(RACES).map((r) => (
        <button
          key={r}
          onClick={() => setSelectedRace(r)}
          className={`p-3 rounded-lg border text-left transition-all ${
            selectedRace === r 
              ? 'border-red-500 bg-red-950/30 text-white shadow-lg' 
              : 'border-slate-700 bg-slate-900/40 text-slate-400 hover:border-slate-500'
          }`}>
          <div className="font-bold text-sm sm:text-base">{r}</div>
        </button>
      ))}
    </div>

    {/* 1. HABILIDADES BÁSICAS DA RAÇA SELECIONADA (Ficam no topo) */}
    {selectedRace && RACES[selectedRace] && (
      <div className="p-4 bg-slate-900 rounded-lg border border-red-900/50 space-y-3 text-xs">
        <div className="font-bold text-red-400 text-sm">
          🛡️ Características Básicas: {selectedRace}
        </div>
        <p className="text-slate-300">{RACES[selectedRace].desc}</p>
        
        {/* Lista de Traços Principais */}
        <div className="space-y-1.5">
          {RACES[selectedRace].traits.map((trait, i) => (
            <div key={i} className="bg-slate-800/80 p-2 rounded border border-slate-700/60">
              <span className="font-bold text-amber-400">{trait.name}: </span>
              <span className="text-slate-300">{trait.desc}</span>
            </div>
          ))}
        </div>
      </div>
    )}

    {/* 2. SUBRAÇAS E SUAS HABILIDADES EXCLUSIVAS (Aparecem em baixo, se existirem) */}
    {RACES[selectedRace]?.hasSubRaces && (
      <div className="p-4 bg-slate-900/90 rounded-xl border border-amber-900/60 space-y-3">
        <div className="text-xs font-bold text-amber-400 uppercase tracking-wide">
          🧬 Escolha de {RACES[selectedRace].subRaceLabel}:
        </div>
        
        {/* Botões para Selecionar a Subraça */}
        <div className="grid grid-cols-2 gap-2">
          {RACES[selectedRace].subRaces.map((sr) => (
            <button
              key={sr.id}
              onClick={() => setSelectedSubRace(sr.id)}
              className={`py-2 px-3 rounded-lg font-bold text-xs border transition-all text-left ${
                selectedSubRace === sr.id 
                  ? 'bg-amber-600 border-amber-400 text-white shadow-md' 
                  : 'bg-slate-800 border-slate-700 text-slate-400 hover:text-white'
              }`}>
              <div>{sr.name}</div>
            </button>
          ))}
        </div>

        {/* Detalhes da Subraça Selecionada */}
        {activeSubRaceObj && (
          <div className="bg-slate-950/80 p-3 rounded-lg border border-amber-800/80 space-y-2 text-xs">
            <div className="font-bold text-amber-300 text-sm">
              ✨ Bônus de {activeSubRaceObj.name}
            </div>
            <p className="text-slate-300">{activeSubRaceObj.desc}</p>
            <div className="bg-slate-900 p-2 rounded border border-slate-800">
              <span className="font-bold text-amber-400">{activeSubRaceObj.extraTrait.name}: </span>
              <span className="text-slate-300">{activeSubRaceObj.extraTrait.desc}</span>
            </div>
          </div>
        )}
      </div>
    )}

    <button 
      onClick={() => setStep(2)} 
      className="t20-btn-primary w-full py-2.5 rounded-lg font-bold text-sm">
      Próximo: Origem ➔
    </button>
  </div>
)}

                      {/* Passo 2: Origem */}
                      {step === 2 && (
                        <div className="t20-card p-4 sm:p-5 space-y-4">
                          <div>
                            <h2 className="text-xl font-bold text-slate-100">2. Escolha sua Origem (Capitais do Mundo)</h2>
                            <p className="text-xs text-slate-400">Cada Origem concede +1 Categoria em uma Perícia e Equipamento Inicial específico.</p>
                          </div>

                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 max-h-72 overflow-y-auto custom-scrollbar pr-1">
                            {Object.keys(ORIGINS).map((origKey) => (
                              <button
                                key={origKey}
                                onClick={() => setSelectedOrigin(origKey)}
                                className={`p-3 rounded-lg border text-left transition-all ${selectedOrigin === origKey ? 'border-amber-500 bg-amber-950/20 text-white shadow' : 'border-slate-800 bg-slate-900/50 text-slate-400 hover:border-slate-700'}`}>
                                <div className="font-bold text-xs sm:text-sm text-slate-200">{origKey}</div>
                                <div className="text-[11px] text-amber-400 mt-0.5"> Perícia: +1 em {ORIGINS[origKey].skillBonus}</div>
                              </button>
                            ))}
                          </div>

                          <div className="p-3 bg-slate-900 rounded-lg border border-slate-800 text-xs space-y-1">
                            <span className="font-bold text-slate-200">Detalhes de {selectedOrigin}:</span>
                            <p className="text-slate-400">{ORIGINS[selectedOrigin].desc}</p>
                            <div className="text-emerald-400 font-semibold pt-1">
                              🎁 Itens Iniciais concedidos: {ORIGINS[selectedOrigin].items.map(i => i.name).join(', ')}
                            </div>
                          </div>

                          <div className="flex gap-3">
                            <button onClick={() => setStep(1)} className="w-1/3 py-2.5 bg-slate-800 text-slate-300 rounded-lg font-bold text-xs sm:text-sm">⬅ Voltar</button>
                            <button onClick={() => setStep(3)} className="t20-btn-primary w-2/3 py-2.5 rounded-lg font-bold text-xs sm:text-sm">Próximo: Classe ➔</button>
                          </div>
                        </div>
                      )}

                      {/* Passo 3: Classe com Seleção de Competências + Sub-escolha */}
                      {step === 3 && (
                        <div className="t20-card p-4 sm:p-5 space-y-4">
                          <div>
                            <h2 className="text-xl font-bold text-slate-100">3. Escolha sua Classe</h2>
                            <p className="text-xs text-slate-400">Escolha sua classe e defina as competências treinas.</p>
                          </div>

                          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            {Object.keys(CLASSES).map((c) => (
                              <button
                                key={c}
                                onClick={() => setSelectedClass(c)}
                                className={`p-3 rounded-lg border text-left transition-all ${selectedClass === c ? 'border-red-500 bg-red-950/30 text-white shadow-lg' : 'border-slate-700 bg-slate-900/40 text-slate-400 hover:border-slate-500'}`}>
                                <div className="font-bold text-sm sm:text-base">{c}</div>
                                <div className="text-[11px] font-bold mt-1">
                                  {CLASSES[c].keyAttr ? (
                                    <span className="text-amber-400">Mod Chave: {CLASSES[c].keyAttr}</span>

                                    <span className="text-slate-500">Classe Marcial</span>
                                  )}
                                </div>
                              </button>
                            ))}
                          </div>

                          {/* SELEÇÃO DINÂMICA DE COMPETÊNCIAS DA CLASSE */}
                          {CLASSES[selectedClass]?.availableCompetencies && (
                            <div className="p-4 bg-slate-950/80 rounded-xl border border-slate-800 space-y-2">
                              <div className="flex justify-between items-center">
                                <span className="text-xs font-bold text-amber-400 uppercase">
                                  📋 Escolha {CLASSES[selectedClass].competencyChoiceCount} Competências de Classe:
                                </span>
                                <span className="text-xs text-slate-400">

                                </span>
                              </div>
                              <div className="flex flex-wrap gap-2 pt-1">
                                {CLASSES[selectedClass].availableCompetencies.map(comp => {
                                  const isSelected = selectedClassCompetencies.includes(comp);
                                  return (
                                    <button
                                      key={comp}
                                      onClick={() => toggleClassCompetency(comp)}
                                      className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition-all ${
                                        isSelected ? 'bg-amber-600 border-amber-400 text-white shadow' : 'bg-slate-900 border-slate-700 text-slate-400 hover:text-white'
                                      }`}>
                                      {comp} {isSelected ? '✓' : ''}
                                    </button>
                                  );
                                })}
                              </div>
                            </div>
                          )}

                                <span className="font-bold text-blue-300 print-black">Ataque Básico de {CLASSES[selectedClass].subChoiceLabel} ({activeSubChoiceObj.attackName}): </span>
                                <span className="text-slate-300 print-black">{activeSubChoiceObj.attackDesc}</span>
                              </div>
                            )}
                          </div>

                          {/* RESISTÊNCIAS */}
                          <div>
                            <div className="text-xs font-bold text-cyan-400 uppercase mb-2 print-black">🛡️ Resistências de Dano:</div>
                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                              {Object.entries(resistances).map(([type, value]) => (
                                <div key={type} className={`p-2 rounded border flex justify-between items-center text-xs ${value > 0 ? 'bg-cyan-950/40 border-cyan-700 text-cyan-200' : 'bg-slate-900 border-slate-800 text-slate-500'} print-border`}>
                                  <span className="print-black">{type}:</span>
                                  <span className="font-bold print-black">{value}</span>
                                </div>
                              ))}
                            </div>
                          </div>

                          {/* TABELA COMPLETA DE PERÍCIAS */}
                          <div>
                            <div className="text-xs font-bold text-slate-300 uppercase mb-2 print-black">📋 Tabela Completa de Perícias:</div>
                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 bg-slate-900 p-3 rounded-lg border border-slate-800 print-border">
                              {SKILLS_LIST.map((skill) => {
                                const catLevel = skillCategories[skill.name] || 0;
                                const attrMod = getMod(skill.attr);
                                const profBonus = COMPETENCY_LEVELS[catLevel].bonus;
                                const totalBonus = attrMod + profBonus;

                                return (
                                  <div key={skill.name} className="flex justify-between items-center text-xs p-1 bg-slate-800/40 rounded print-border">
                                    <span className="text-slate-300 print-black">{skill.name} <span className="text-[10px] text-slate-500 print-black">({skill.attr})</span>:</span>
                                    <span className="font-bold text-amber-400 print-black">{totalBonus >= 0 ? `+${totalBonus}` : totalBonus}</span>
                                  </div>
                                );
                              })}
                            </div>
                          </div>

                          {/* IDIOMAS E KITS */}
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-slate-900 p-4 rounded-lg border border-slate-800 print-border">
                            <div>
                              <div className="text-xs font-bold text-purple-400 uppercase mb-1 print-black">🗣️ Idiomas Adquiridos:</div>
                              <div className="text-xs text-slate-200 font-semibold print-black">
                                Comum{boughtLanguages.length > 0 ? `, ${boughtLanguages.join(', ')}` : ''}
                              </div>
                            </div>
                            <div>
                              <div className="text-xs font-bold text-emerald-400 uppercase mb-1 print-black">🧰 Categorias de Kits / Ferramentas:</div>
                              <div className="text-xs text-slate-300 space-y-0.5 print-black">
                                {Object.entries(toolCategories).filter(([_, catLvl]) => catLvl > 0).length === 0 ? (
                                  <span className="text-slate-500 italic print-black">Nenhum kit treinado acima de Destreinado</span>
                                ) : (
                                  Object.entries(toolCategories).filter(([_, catLvl]) => catLvl > 0).map(([tName, catLvl]) => (
                                    <div key={tName} className="font-semibold text-emerald-300 print-black">
                                      • {tName}: <span className="text-amber-400 print-black">{COMPETENCY_LEVELS[catLvl].name} (+{COMPETENCY_LEVELS[catLvl].bonus})</span>
                                    </div>
                                  ))
                                )}
                              </div>
                            </div>
                          </div>

                          {/* PAINEL DE EQUIPAMENTOS */}
                          <div className="bg-slate-900 p-4 rounded-lg space-y-3 border border-slate-800 print-border">
                            <div className="text-xs font-bold text-emerald-400 uppercase border-b border-slate-800 pb-2 print-black">
                              🎒 Equipamentos & Inventário
                            </div>
                            
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                              {['Arma', 'Armadura', 'Ferramenta'].map(cat => (
                                <div key={cat} className="space-y-2 bg-slate-950/60 p-2.5 rounded border border-slate-800 print-border">
                                  <div className="text-[11px] font-bold text-slate-400 uppercase border-b border-slate-800 pb-1 print-black">{cat}s</div>
                                  <div className="space-y-1.5">
                                    {equipment.filter(i => i.category === cat).map((item, idx) => (
                                      <div key={idx} className="flex justify-between items-center text-xs bg-slate-900 p-1.5 rounded border border-slate-800 print-border">
                                        <span className="text-slate-200 print-black">{item.name}</span>
                                        <button onClick={() => removeEquipmentItem(equipment.indexOf(item))} className="text-red-400 hover:text-red-300 ml-1 font-bold no-print">×</button>
                                      </div>
                                    ))}
                                  </div>
                                </div>
                              ))}
                            </div>

                            <div className="flex gap-2 pt-2 border-t border-slate-800 no-print">
                              <select value={newItemCat} onChange={(e) => setNewItemCat(e.target.value)} className="bg-slate-800 text-xs text-slate-200 border border-slate-700 rounded p-2">
                                <option value="Arma">Arma</option>
                                <option value="Armadura">Armadura</option>
                                <option value="Ferramenta">Ferramenta</option>
                              </select>
                              <input type="text" placeholder="Nome do item..." value={newItemName} onChange={(e) => setNewItemName(e.target.value)} className="flex-1 bg-slate-800 border border-slate-700 rounded p-2 text-xs text-white" />
                              <button onClick={addEquipmentItem} className="px-3 py-2 bg-emerald-700 text-white rounded text-xs font-bold">➕ Adicionar</button>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>

                    {/* Resumo Lateral */}
                    <div className="t20-card p-4 sm:p-5 h-fit space-y-3 no-print">
                      <h3 className="text-base font-bold text-slate-200 border-b border-slate-800 pb-2">Resumo Rápido</h3>
                      <div className="space-y-2 text-xs sm:text-sm">
                        <div className="flex justify-between"><span className="text-slate-500">Raça:</span> <span className="font-bold text-red-400">{selectedRace}</span></div>
                        {selectedSubRace && <div className="flex justify-between"><span className="text-slate-500">Subraça:</span> <span className="font-bold text-amber-400">{selectedSubRace}</span></div>}
                        <div className="flex justify-between"><span className="text-slate-500">Origem:</span> <span className="font-bold text-amber-400 truncate max-w-[120px]">{selectedOrigin.split(' ')[0]}</span></div>
                        <div className="flex justify-between"><span className="text-slate-500">Classe:</span> <span className="font-bold text-red-400">{selectedClass}</span></div>
                        {classKeyAttr ? (
                          <div className="flex justify-between"><span className="text-slate-500">Mod Chave:</span> <span className="font-bold text-amber-400">{classKeyAttr} (+{classKeyMod})</span></div>
                        ) : (
                          <div className="flex justify-between"><span className="text-slate-500">Mod Chave:</span> <span className="font-bold text-slate-500">Nenhum</span></div>
                        )}
                        <div className="flex justify-between"><span className="text-slate-500">PV:</span> <span className="font-bold text-white">{totalPV}</span></div>
                        <div className="flex justify-between"><span className="text-slate-500">PM:</span> <span className="font-bold text-white">{totalPM}</span></div>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* ABA REGRAS */}
          {activeTab === 'rules' && (
            <div className="space-y-4">
              <h2 className="text-2xl font-bold text-slate-100">Guia Rápido de Regras</h2>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="t20-card p-4 space-y-2">
                  <h3 className="font-bold text-red-400 text-lg">⚡ Pontos de Inteligência</h3>
                  <p className="text-xs text-slate-300">Seus pontos de INT são usados para subir Graus de Categoria em Perícias, Defesas, Ataques, Idiomas Extras e Kits de Ferramentas!</p>
                </div>
              </div>
            </div>
          )}

          {/* ABA O MUNDO */}
          {activeTab === 'world' && (
            <div className="t20-card p-4 sm:p-6 space-y-6">
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-800 pb-4 gap-3">
                <div>
                  <h2 className="text-2xl font-black text-red-500">O Mundo & As 12 Capitais</h2>
                  <p className="text-xs text-slate-400">Lore, Territórios, Facções e Fatos Históricos do Cenário</p>
                </div>
                
                {/* SUB-ABAS DE NAVEGAÇÃO DO MUNDO */}
                <div className="flex flex-wrap gap-1.5 bg-slate-900 p-1.5 rounded-lg border border-slate-800">
                  <button onClick={() => setWorldSubTab('overview')} className={`px-3 py-1.5 rounded text-xs font-bold transition-all ${worldSubTab === 'overview' ? 'bg-red-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                    🌐 Visão Geral
                  </button>
                  <button onClick={() => setWorldSubTab('regioes')} className={`px-3 py-1.5 rounded text-xs font-bold transition-all ${worldSubTab === 'regioes' ? 'bg-red-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                    🏰 Capitais
                  </button>
                  <button onClick={() => setWorldSubTab('facoes')} className={`px-3 py-1.5 rounded text-xs font-bold transition-all ${worldSubTab === 'facoes' ? 'bg-red-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                    ⚔️ Facções
                  </button>
                  <button onClick={() => setWorldSubTab('fatos')} className={`px-3 py-1.5 rounded text-xs font-bold transition-all ${worldSubTab === 'fatos' ? 'bg-red-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                    📜 Fatos & Segredos
                  </button>
                </div>
              </div>

              {/* CONTEÚDO DAS SUB-ABAS COM HYPERLINKS INTERNOS */}
              {worldSubTab === 'overview' && (
                <div className="space-y-4 text-xs text-slate-300 leading-relaxed">
                  <div className="p-4 bg-slate-900 rounded-xl border border-slate-800 space-y-2">
                    <h3 className="text-base font-bold text-red-400">O Continente das Doze Estrelas</h3>
                    <p>
                      Um vasto mundo governado pela concordância das <a href="#capitais" onClick={(e) => { e.preventDefault(); setWorldSubTab('regioes'); }} className="text-amber-400 underline font-bold hover:text-amber-300">12 Capitais Imperiais</a>. Cada capital mantém um monopólio cultural, militar ou mágico, influenciando diretamente o treinamento de seus cidadãos.
                    </p>
                    <p>
                      Conflitos velados entre as <a href="#facoes" onClick={(e) => { e.preventDefault(); setWorldSubTab('facoes'); }} className="text-blue-400 underline font-bold hover:text-blue-300">Grandes Facções</a> ameaçam romper a trégua secular, enquanto investigadores buscam desvendar os <a href="#fatos" onClick={(e) => { e.preventDefault(); setWorldSubTab('fatos'); }} className="text-purple-400 underline font-bold hover:text-purple-300">Segredos Antigos</a> esquecidos nas ruínas continentais.
                    </p>
                  </div>
                </div>
              )}

              {worldSubTab === 'regioes' && (
                <div className="space-y-4">
                  <h3 className="text-base font-bold text-amber-400">Capitais Imperiais & Territórios</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                    {Object.keys(ORIGINS).map(key => (
                      <div key={key} className="p-3 bg-slate-900 rounded-lg border border-slate-800 space-y-1">
                        <div className="font-bold text-slate-100 text-sm">{key}</div>
                        <p className="text-slate-400">{ORIGINS[key].desc}</p>
                        <div className="text-[11px] text-amber-400 font-semibold pt-1">
                          Perícia Associada: {ORIGINS[key].skillBonus}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {worldSubTab === 'facoes' && (
                <div className="space-y-4">
                  <h3 className="text-base font-bold text-blue-400">Facções & Ordens Continentais</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                    <div className="p-3 bg-slate-900 rounded-lg border border-slate-800 space-y-1">
                      <div className="font-bold text-slate-100 text-sm">O Almirantado Solar</div>
                      <p className="text-slate-400">Controladores das rotas de <a href="#porto" onClick={(e) => { e.preventDefault(); setWorldSubTab('regioes'); }} className="text-amber-400 underline font-bold">Porto Solis</a> e defensores das águas comerciais.</p>
                    </div>
                    <div className="p-3 bg-slate-900 rounded-lg border border-slate-800 space-y-1">
                      <div className="font-bold text-slate-100 text-sm">Círculo dos Arcanistas</div>
                      <p className="text-slate-400">Sediados em <a href="#kael" onClick={(e) => { e.preventDefault(); setWorldSubTab('regioes'); }} className="text-amber-400 underline font-bold">Kael-Thas</a>, guardam tomos proibidos e controlam o fluxo de mana.</p>
                    </div>
                  </div>
                </div>
              )}

              {worldSubTab === 'fatos' && (
                <div className="space-y-4">
                  <h3 className="text-base font-bold text-purple-400">Segredos & Histórias do Mundo</h3>
                  <div className="p-4 bg-slate-900 rounded-lg border border-slate-800 space-y-2 text-xs text-slate-300">
                    <div className="font-bold text-slate-100 text-sm">O Pacto das Doze Chaves</div>
                    <p>Assinado após a Grande Calamidade, estabeleceu que cada capital teria autoridade sobre um ramo do saber humano e arcano.</p>
                    <p className="pt-2">
                      Aprenda mais sobre os defensores desse pacto em <a href="#facoes" onClick={(e) => { e.preventDefault(); setWorldSubTab('facoes'); }} className="text-blue-400 underline font-bold">Facções</a> ou explore as <a href="#regioes" onClick={(e) => { e.preventDefault(); setWorldSubTab('regioes'); }} className="text-amber-400 underline font-bold">Capitais</a>.
                    </p>
                  </div>
                </div>
              )}
            </div>
          )}

{/* Modal de Regras Completo */}
{showRulesModal && (
  <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 sm:p-6 overflow-y-auto">
    <div className="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-4xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      
      {/* Cabecera do Modal */}
      <div className="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/50">
        <div className="flex items-center gap-2">
          <span className="text-xl">📖</span>
          <h2 className="text-lg font-bold text-slate-100">Guia de Regras & Referência</h2>
        </div>
        <button
          onClick={() => setShowRulesModal(false)}
          className="text-slate-400 hover:text-white font-bold p-1 rounded-lg hover:bg-slate-800 transition-all text-sm">
          ✕ Fechar
        </button>
      </div>

      {/* Navegação de Sub-abas */}
      <div className="flex border-b border-slate-800 bg-slate-950/60 overflow-x-auto px-4 gap-1">
        {['Ficha', 'Combate', 'Viagem', 'Condições'].map((tab) => (
          <button
            key={tab}
            onClick={() => setActiveRulesTab(tab)}
            className={`py-3 px-4 text-xs font-bold transition-all border-b-2 whitespace-nowrap ${
              activeRulesTab === tab
                ? 'border-red-500 text-red-400 bg-slate-900/50'
                : 'border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-900/30'
            }`}>
            {tab}
          </button>
        ))}
      </div>

      {/* Conteúdo das Sub-abas */}
      <div className="p-5 overflow-y-auto space-y-4 text-xs sm:text-sm text-slate-300 flex-1">
        
        {/* ABA: FICHA */}
        {activeRulesTab === 'Ficha' && (
          <div className="space-y-4">
            <h3 className="text-base font-bold text-slate-100 border-b border-slate-800 pb-2">
              📋 Regras de Ficha & Testes
            </h3>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div className="bg-slate-950/60 p-3.5 rounded-lg border border-slate-800 space-y-1">
                <span className="font-bold text-amber-400">Testes de Perícia:</span>
                <p className="text-slate-400">Role 1d20 + Modificador de Atributo + Treino + Bônus Diversos contra a CD (Classe de Dificuldade) estipulada pelo mestre.</p>
              </div>
              <div className="bg-slate-950/60 p-3.5 rounded-lg border border-slate-800 space-y-1">
                <span className="font-bold text-amber-400">Pontos de Vida & Mana:</span>
                <p className="text-slate-400">PV representa sua resiliência física e Mana (PM) alimenta suas habilidades especiais, magias e recursos de classe.</p>
              </div>
            </div>
          </div>
        )}

        {/* ABA: COMBATE */}
        {activeRulesTab === 'Combate' && (
          <div className="space-y-4">
            <h3 className="text-base font-bold text-slate-100 border-b border-slate-800 pb-2">
              ⚔️ Ações de Combate
            </h3>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div className="bg-slate-950/60 p-3.5 rounded-lg border border-slate-800 space-y-1">
                <span className="font-bold text-red-400">Ação Padrão:</span>
                <p className="text-slate-400">Atacar, conjurar uma magia padrão, usar habilidade ativa ou realizar um teste que exija esforço direto.</p>
              </div>
              <div className="bg-slate-950/60 p-3.5 rounded-lg border border-slate-800 space-y-1">
                <span className="font-bold text-blue-400">Ação de Movimento:</span>
                <p className="text-slate-400">Deslocar-se até seu deslocamento base, sacar/guardar um item, levantar-se de caído ou abrir uma porta.</p>
              </div>
              <div className="bg-slate-950/60 p-3.5 rounded-lg border border-slate-800 space-y-1">
                <span className="font-bold text-emerald-400">Ação Livre & Reação:</span>
                <p className="text-slate-400">Falar frases curtas, soltar um item. Reações ocorrem fora do seu turno em resposta a gatilhos específicos.</p>
              </div>
              <div className="bg-slate-950/60 p-3.5 rounded-lg border border-slate-800 space-y-1">
                <span className="font-bold text-amber-400">Defesa & Esquiva:</span>
                <p className="text-slate-400">Sua Defesa é o valor que os inimigos precisam atingir no d20 para acertar um ataque em você.</p>
              </div>
            </div>
          </div>
        )}

        {/* ABA: VIAGEM */}
        {activeRulesTab === 'Viagem' && (
          <div className="space-y-4">
            <h3 className="text-base font-bold text-slate-100 border-b border-slate-800 pb-2">
              🗺️ Exploração & Viagem
            </h3>
            <div className="space-y-3">
              <div className="bg-slate-950/60 p-3.5 rounded-lg border border-slate-800 space-y-1">
                <span className="font-bold text-amber-400">Marcha & Deslocamento:</span>
                <p className="text-slate-400">Uma jornada padrão cobre cerca de 24 km por dia em terreno normal. Terrenos difíceis (pântanos, montanhas) reduzem a velocidade pela metade.</p>
              </div>
              <div className="bg-slate-950/60 p-3.5 rounded-lg border border-slate-800 space-y-1">
                <span className="font-bold text-amber-400">Acampamento & Descanso:</span>
                <p className="text-slate-400">Um descanso longo (8 horas) recupera PV e PM com base no seu nível e condições do acampamento. Requer testes de Sobrevivência para vigília e forrageamento.</p>
              </div>
            </div>
          </div>
        )}

        {/* ABA: CONDIÇÕES */}
        {activeRulesTab === 'Condições' && (
          <div className="space-y-4">
            <h3 className="text-base font-bold text-slate-100 border-b border-slate-800 pb-2">
              🧪 Condições & Status
            </h3>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div className="bg-slate-950/60 p-3.5 rounded-lg border border-slate-800 space-y-1">
                <span className="font-bold text-purple-400">Abatido / Atordoado:</span>
                <p className="text-slate-400">Não pode realizar ações ou reações. Perde a defesa de Destreza.</p>
              </div>
              <div className="bg-slate-950/60 p-3.5 rounded-lg border border-slate-800 space-y-1">
                <span className="font-bold text-purple-400">Caído:</span>
                <p className="text-slate-400">-5 em ataques corpo a corpo concedidos aos inimigos próximos. Exige Ação de Movimento para levantar.</p>
              </div>
              <div className="bg-slate-950/60 p-3.5 rounded-lg border border-slate-800 space-y-1">
                <span className="font-bold text-purple-400">Sangrando / Envenenado:</span>
                <p className="text-slate-400">Recebe dano contínuo no início de cada turno até passar em um teste de Constituição/Cura ou ser curado.</p>
              </div>
              <div className="bg-slate-950/60 p-3.5 rounded-lg border border-slate-800 space-y-1">
                <span className="font-bold text-purple-400">Vulnerável:</span>
                <p className="text-slate-400">Sofre penalidade de -2 na Defesa e não pode aplicar bônus de esquiva.</p>
              </div>
            </div>
          </div>
        )}

      </div>
    </div>
  </div>
)}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
