<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUB de RPG - Sistema Personalizado</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone para transpilar JSX no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .t20-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; }
    .t20-btn-primary { background-color: #dc2626; color: white; transition: all 0.2s; }
    .t20-btn-primary:hover { background-color: #b91c1c; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- TABELA DE NÍVEIS DE COMPETÊNCIA ---
    const COMPETENCY_LEVELS = [
      { level: 0, name: "Destreinado", bonus: 0 },
      { level: 1, name: "Proficiente", bonus: 2 },
      { level: 2, name: "Habilidoso", bonus: 4 },
      { level: 3, name: "Talentoso", bonus: 6 },
      { level: 4, name: "Prodígio", bonus: 8 },
      { level: 5, name: "Mestre", bonus: 10 }
    ];

    // --- LISTA PADRÃO DE PERÍCIAS ---
    const SKILLS_LIST = [
      { name: "Acrobacia", attr: "DES" },
      { name: "Adestramento", attr: "CAR" },
      { name: "Atletismo", attr: "FOR" },
      { name: "Atuação", attr: "CAR" },
      { name: "Conhecimento", attr: "INT" },
      { name: "Cura", attr: "SAB" },
      { name: "Diplomacia", attr: "CAR" },
      { name: "Enganação", attr: "CAR" },
      { name: "Furtividade", attr: "DES" },
      { name: "Intimidação", attr: "CAR" },
      { name: "Intuição", attr: "SAB" },
      { name: "Investigação", attr: "INT" },
      { name: "Ladinagem", attr: "DES" },
      { name: "Misticismo", attr: "INT" },
      { name: "Ofício", attr: "INT" },
      { name: "Percepção", attr: "SAB" },
      { name: "Pilotagem", attr: "DES" },
      { name: "Religião", attr: "SAB" },
      { name: "Sobrevivência", attr: "SAB" }
    ];

    // --- ESTRUTURA DE RAÇAS COM RESERVA DE PODERES ---
    const RACES = {
      Humano: {
        desc: "Versáteis e adaptáveis, começam com 2 pontos na reserva de Poderes Gerais.",
        mods: { FOR: 1, DES: 1, CON: 1, INT: 0, SAB: 0, CAR: 0 },
        traits: [
          { name: "Versátil", desc: "Aprende duas perícias adicionais e ganha +1 ponto em Poder Geral extra." }
        ],
        powerSlotsBonus: { Geral: 2, Arcano: 0, Divino: 0, Ínfero: 0 }
      },
      Anão: {
        desc: "Resistentes e tradicionais, peritos em combate e trabalhos em pedra/metal.",
        mods: { FOR: 0, DES: -1, CON: 2, INT: 0, SAB: 1, CAR: 0 },
        traits: [
          { name: "Duro como Pedra", desc: "Aumenta seus PVs máximos em +3 no 1º nível." },
          { name: "Visão no Escuro", desc: "Enxerga na escuridão natural em alcance curto." }
        ],
        powerSlotsBonus: { Geral: 1, Arcano: 0, Divino: 0, Ínfero: 0 }
      },
      Ínfero: {
        desc: "Crias de linhagens sombrias ou infernais, marcados por chifres ou olhos flamejantes.",
        mods: { FOR: 0, DES: 1, CON: 0, INT: 1, SAB: -1, CAR: 1 },
        traits: [
          { name: "Herança Sombria", desc: "Começam com 1 vaga extra para escolher um Poder Ínfero." }
        ],
        powerSlotsBonus: { Geral: 1, Arcano: 0, Divino: 0, Ínfero: 1 }
      }
    };

    // --- ESTRUTURA DE CLASSES COM OPÇÕES DE SUB-ESCOLHAS ---
    const CLASSES = {
      Guerreiro: {
        basePV: 20, basePM: 3,
        classCompetencies: ["Atletismo", "Luta"],
        defensesConfig: { Fortitude: 2, Reflexos: 1, Vontade: 0 },
        attacksConfig: { Luta: 2, Pontaria: 1 },
        powerSlotsBonus: { Geral: 0, Arcano: 0, Divino: 0, Ínfero: 0 },
        abilities: [
          { name: "Ataque Especial", desc: "Gaste 1 PM para somar +4 no teste de ataque ou dano." },
          { name: "Durão", desc: "Reação (2 PM): reduz o dano sofrido pela metade." }
        ]
      },
      Feiticeiro: {
        basePV: 8, basePM: 6,
        classCompetencies: ["Misticismo", "Conhecimento"],
        defensesConfig: { Vontade: 2, Reflexos: 1, Fortitude: 0 },
        attacksConfig: { Luta: 0, Pontaria: 1 },
        powerSlotsBonus: { Geral: 0, Arcano: 1, Divino: 0, Ínfero: 0 },
        // SUB-ESCOLHA: Linhagem Elemental
        subChoiceLabel: "Linhagem Elemental",
        subChoices: [
          { id: "fogo", name: "Fogo", attackName: "Raio Flamejante", attackDesc: "Ataque à distância causando 1d6 de dano de Fogo e incendiando o alvo." },
          { id: "gelo", name: "Gelo", attackName: "Lança de Gelo", attackDesc: "Ataque à distância causando 1d6 de dano de Frio e reduzindo deslocamento em -3m." },
          { id: "trovao", name: "Trovão", attackName: "Choque Elétrico", attr: "DES", attackDesc: "Ataque à distância causando 1d6 de dano Elétrico e atordoando em acerto crítico." }
        ],
        abilities: [
          { name: "Conjuração Arcana", desc: "Capacidade de lançar magias arcanas utilizando Mana." }
        ]
      },
      Clérigo: {
        basePV: 16, basePM: 5,
        classCompetencies: ["Religião", "Cura"],
        defensesConfig: { Vontade: 2, Fortitude: 1, Reflexos: 0 },
        attacksConfig: { Luta: 1, Pontaria: 0 },
        powerSlotsBonus: { Geral: 0, Arcano: 0, Divino: 1, Ínfero: 0 },
        abilities: [
          { name: "Devoto Fiel", desc: "Canaliza energia divina e tem acesso a Poderes Divinos." }
        ]
      }
    };

    // --- BANCO DE PODERES ---
    const POWERS_DATABASE = {
      Geral: [
        { id: 'g1', name: 'Ataque Poderoso', desc: '-2 no ataque para causar +5 de dano corpo a corpo.' },
        { id: 'g2', name: 'Esquiva', desc: '+2 na Defesa e em testes de Reflexos.' },
        { id: 'g3', name: 'Vontade de Ferro', desc: '+2 em testes de Vontade e +1 PM por nível.' },
        { id: 'g4', name: 'Vitalidade', desc: '+1d8 de PV adicionais e +2 em testes de Fortitude.' }
      ],
      Arcano: [
        { id: 'a1', name: 'Magia Expandida', desc: 'Aumenta o alcance de suas magias em um passo.' },
        { id: 'a2', name: 'Foco em Mana', desc: 'Reduz o custo de todas as suas magias em -1 PM (mínimo 1).' }
      ],
      Divino: [
        { id: 'd1', name: 'Benção dos Céus', desc: '+2 em testes de Diplomacia e Cura.' },
        { id: 'd2', name: 'Escudo da Fé', desc: 'Reação (1 PM): Concede +2 em Defesa ou em uma Resistência.' }
      ],
      Ínfero: [
        { id: 'i1', name: 'Sangue Fervente', desc: 'Resistência a Fogo 5 e +2 em Intimidação.' },
        { id: 'i2', name: 'Garras das Sombras', desc: 'Seus ataques desarmados causam dano cortante e somam +1 na margem de ameaça.' }
      ]
    };

    function App() {
      // Navegação por abas principais (Minhas Fichas, Regras Rápidas, O Mundo)
      const [activeTab, setActiveTab] = useState('saved');
      
      // Modo de visualização/edição no criador
      const [isCreatingNew, setIsCreatingNew] = useState(false);
      const [step, setStep] = useState(1);
      
      const [savedCharacters, setSavedCharacters] = useState(() => {
        try {
          const local = localStorage.getItem('rpg_characters');
          return local ? JSON.parse(local) : [];
        } catch(e) { return []; }
      });
      const [editingId, setEditingId] = useState(null);

      const [name, setName] = useState('');
      const [selectedRace, setSelectedRace] = useState('Humano');
      const [selectedClass, setSelectedClass] = useState('Guerreiro');
      const [selectedSubChoice, setSelectedSubChoice] = useState('');

      const [attributes, setAttributes] = useState({ FOR: 10, DES: 10, CON: 10, INT: 10, SAB: 10, CAR: 10 });
      
      const [baseSkillCategories, setBaseSkillCategories] = useState({});
      const [skillCategories, setSkillCategories] = useState({});

      const [baseDefenseCategories, setBaseDefenseCategories] = useState({ Fortitude: 0, Reflexos: 0, Vontade: 0 });
      const [defenseCategories, setDefenseCategories] = useState({ Fortitude: 0, Reflexos: 0, Vontade: 0 });

      const [baseAttackCategories, setBaseAttackCategories] = useState({ Luta: 0, Pontaria: 0 });
      const [attackCategories, setAttackCategories] = useState({ Luta: 0, Pontaria: 0 });

      const [selectedPowers, setSelectedPowers] = useState({
        Geral: [], Arcano: [], Divino: [], Ínfero: []
      });
      
      const [powerCategoryTab, setPowerCategoryTab] = useState('Geral');
      const [hoveredRace, setHoveredRace] = useState(null);
      const [hoveredClass, setHoveredClass] = useState(null);
      const [warningMessage, setWarningMessage] = useState(null);

      // Estado do Mundo
      const [worldSubTab, setWorldSubTab] = useState('overview');
      const [isEditingLore, setIsEditingLore] = useState(false);
      const [worldData, setWorldData] = useState({
        overview: { title: "Visão Geral do Mundo", desc: "Um mundo de arquipélagos flutuantes e tempestades arcanas onde magias antigas regem o destino dos impérios." },
        regioes: { title: "Regiões Principais", desc: "As terras conhecidas dividem-se em três grandes domínios. Visite também a aba de [link:facoes|Facções] para entender quem controla cada território." },
        facoes: { title: "Facções e Guildas", desc: "Três grandes poderes moldam a política atual. Retorne à [link:overview|Visão Geral]." },
        fatos: { title: "Segredos e Fatos", desc: "Informações que todo aventureiro deve saber antes de iniciar sua jornada." }
      });

      // Efeito ao trocar de classe: reseta competências e ajusta sub-escolhas
      useEffect(() => {
        const cls = CLASSES[selectedClass];
        if (cls) {
          const bSkills = {};
          SKILLS_LIST.forEach(s => { bSkills[s.name] = 0; });
          cls.classCompetencies.forEach(sc => { bSkills[sc] = 1; });
          setBaseSkillCategories(bSkills);
          setSkillCategories({ ...bSkills });

          const bDefs = cls.defensesConfig || { Fortitude: 0, Reflexos: 0, Vontade: 0 };
          setBaseDefenseCategories({ ...bDefs });
          setDefenseCategories({ ...bDefs });

          const bAtks = cls.attacksConfig || { Luta: 0, Pontaria: 0 };
          setBaseAttackCategories({ ...bAtks });
          setAttackCategories({ ...bAtks });

          if (cls.subChoices && cls.subChoices.length > 0) {
            setSelectedSubChoice(cls.subChoices[0].id);
          } else {
            setSelectedSubChoice('');
          }
        }
      }, [selectedClass]);

      useEffect(() => {
        try {
          localStorage.setItem('rpg_characters', JSON.stringify(savedCharacters));
        } catch(e) {}
      }, [savedCharacters]);

      const calcMod = (val) => Math.floor((val - 10) / 2);
      const getFinalAttr = (attr) => attributes[attr] + ((RACES[selectedRace]?.mods[attr] || 0) * 2);
      const getMod = (attr) => calcMod(getFinalAttr(attr));
      
      const totalPV = (CLASSES[selectedClass]?.basePV || 0) + getMod('CON');
      const totalPM = (CLASSES[selectedClass]?.basePM || 0) + getMod('INT');
      
      // Cálculo da Reserva Limite de Vagas para Poderes em cada Categoria
      const getPowerCategoryMaxSlots = (category) => {
        const raceSlots = RACES[selectedRace]?.powerSlotsBonus?.[category] || 0;
        const classSlots = CLASSES[selectedClass]?.powerSlotsBonus?.[category] || 0;
        return raceSlots + classSlots;
      };

      // Cálculo dos Pontos de Inteligência Gastos
      const intMod = getMod('INT');
      const intBonusPoints = Math.max(0, intMod);

      const calculateSpentPoints = (currents, bases) => {
        let spent = 0;
        Object.keys(currents).forEach(k => {
          const diff = (currents[k] || 0) - (bases[k] || 0);
          if (diff > 0) spent += diff;
        });
        return spent;
      };

      const spentSkills = calculateSpentPoints(skillCategories, baseSkillCategories);
      const spentDefs = calculateSpentPoints(defenseCategories, baseDefenseCategories);
      const spentAtks = calculateSpentPoints(attackCategories, baseAttackCategories);
      const totalSpentPoints = spentSkills + spentDefs + spentAtks;
      const remainingIntPoints = intBonusPoints - totalSpentPoints;

      // Seleção Controlada de Poderes baseada no Limite de Vagas
      const togglePower = (category, powerId) => {
        setWarningMessage(null);
        const list = selectedPowers[category] || [];
        const isSelected = list.includes(powerId);

        if (isSelected) {
          // Desmarcar
          setSelectedPowers(prev => ({
            ...prev,
            [category]: list.filter(id => id !== powerId)
          }));
        } else {
          // Marcar com validação de limite
          const maxSlots = getPowerCategoryMaxSlots(category);
          if (list.length >= maxSlots) {
            setWarningMessage(`Você só possui ${maxSlots} vaga(s) para Poderes ${category}s!`);
            return;
          }
          setSelectedPowers(prev => ({
            ...prev,
            [category]: [...list, powerId]
          }));
        }
      };

      const handleCategoryChange = (type, key, newVal) => {
        setWarningMessage(null);
        let currents, bases, setter;

        if (type === 'skill') { currents = skillCategories; bases = baseSkillCategories; setter = setSkillCategories; }
        else if (type === 'defense') { currents = defenseCategories; bases = baseDefenseCategories; setter = setDefenseCategories; }
        else if (type === 'attack') { currents = attackCategories; bases = baseAttackCategories; setter = setAttackCategories; }

        const oldVal = currents[key] || 0;
        const baseVal = bases[key] || 0;

        if (newVal < baseVal) return;

        const diffChange = newVal - oldVal;
        if (diffChange > 0 && diffChange > remainingIntPoints) {
          setWarningMessage(`Pontos de Inteligência insuficientes para subir "${key}"!`);
          return;
        }

        setter(prev => ({ ...prev, [key]: newVal }));
      };

      // Cálculos Finais de Defesas e Ataques
      const getDefenseValue = (type, attrName) => {
        const catLevel = defenseCategories[type] || 0;
        const profBonus = COMPETENCY_LEVELS[catLevel].bonus;
        const attrMod = getMod(attrName);
        let powerBonus = 0;
        if (type === 'Reflexos' && selectedPowers.Geral?.includes('g2')) powerBonus += 2;
        if (type === 'Vontade' && selectedPowers.Geral?.includes('g3')) powerBonus += 2;
        if (type === 'Fortitude' && selectedPowers.Geral?.includes('g4')) powerBonus += 2;
        return 8 + profBonus + attrMod + powerBonus;
      };

      const finalFortitude = getDefenseValue('Fortitude', 'CON');
      const finalReflexos = getDefenseValue('Reflexos', 'DES');
      const finalVontade = getDefenseValue('Vontade', 'SAB');

      const getAttackValue = (type, attrName) => {
        const catLevel = attackCategories[type] || 0;
        const profBonus = COMPETENCY_LEVELS[catLevel].bonus;
        const attrMod = getMod(attrName);
        return profBonus + attrMod;
      };

      const finalLuta = getAttackValue('Luta', 'FOR');
      const finalPontaria = getAttackValue('Pontaria', 'DES');

      const handleSaveCharacter = () => {
        const charData = {
          id: editingId || Date.now().toString(),
          name: name || 'Personagem Sem Nome',
          selectedRace,
          selectedClass,
          selectedSubChoice,
          attributes,
          skillCategories,
          defenseCategories,
          attackCategories,
          selectedPowers,
          totalPV,
          totalPM,
          finalFortitude,
          finalReflexos,
          finalVontade,
          finalLuta,
          finalPontaria
        };

        if (editingId) {
          setSavedCharacters(prev => prev.map(c => c.id === editingId ? charData : c));
        } else {
          setSavedCharacters(prev => [...prev, charData]);
        }
        setEditingId(charData.id);
        setIsCreatingNew(false);
        setActiveTab('saved');
        alert('Ficha salva com sucesso!');
      };

      const handleLoadCharacter = (char) => {
        setEditingId(char.id);
        setName(char.name);
        setSelectedRace(char.selectedRace);
        setSelectedClass(char.selectedClass);
        setSelectedSubChoice(char.selectedSubChoice || '');
        setAttributes(char.attributes);
        setSkillCategories(char.skillCategories || {});
        setDefenseCategories(char.defenseCategories || { Fortitude: 0, Reflexos: 0, Vontade: 0 });
        setAttackCategories(char.attackCategories || { Luta: 0, Pontaria: 0 });
        setSelectedPowers(char.selectedPowers || { Geral: [], Arcano: [], Divino: [], Ínfero: [] });
        setIsCreatingNew(true);
        setStep(6);
      };

      const handleNewCharacter = () => {
        setEditingId(null);
        setName('');
        setSelectedRace('Humano');
        setSelectedClass('Guerreiro');
        setSelectedSubChoice('');
        setAttributes({ FOR: 10, DES: 10, CON: 10, INT: 10, SAB: 10, CAR: 10 });
        setSelectedPowers({ Geral: [], Arcano: [], Divino: [], Ínfero: [] });
        setIsCreatingNew(true);
        setStep(1);
      };

      const handleDeleteCharacter = (id) => {
        if (confirm('Deseja excluir este personagem?')) {
          setSavedCharacters(prev => prev.filter(c => c.id !== id));
          if (editingId === id) setIsCreatingNew(false);
        }
      };

      const totalPowersCount = Object.values(selectedPowers).reduce((acc, list) => acc + list.length, 0);

      const activeSubChoiceObj = CLASSES[selectedClass]?.subChoices?.find(sc => sc.id === selectedSubChoice);

      const renderFormattedText = (text) => {
        if (!text) return null;
        const regex = /\[link:(.*?)\|(.*?)\]/g;
        const parts = [];
        let lastIndex = 0;
        let match;

        while ((match = regex.exec(text)) !== null) {
          const [fullMatch, targetTab, linkText] = match;
          const matchIndex = match.index;
          if (matchIndex > lastIndex) {
            parts.push(text.substring(lastIndex, matchIndex));
          }
          parts.push(
            <button
              key={matchIndex}
              onClick={() => setWorldSubTab(targetTab)}
              className="text-red-400 font-bold underline hover:text-red-300 mx-1 bg-red-950/40 px-1.5 py-0.5 rounded border border-red-900/50 transition-all inline-flex items-center gap-1">
              🔗 {linkText}
            </button>
          );
          lastIndex = regex.lastIndex;
        }
        if (lastIndex < text.length) {
          parts.push(text.substring(lastIndex));
        }
        return parts;
      };

      return (
        <div className="min-h-screen flex flex-col max-w-5xl mx-auto p-3 sm:p-4 md:p-6">
          {/* Header Responsivo */}
          <header className="flex flex-col md:flex-row justify-between items-center pb-4 md:pb-6 mb-4 md:mb-6 border-b border-slate-800 gap-4">
            <div>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-red-500 flex items-center gap-2">
                🛡️ HUB de RPG & Criador
              </h1>
              <p className="text-slate-400 text-xs sm:text-sm">Gerencie suas fichas e explore o mundo da campanha</p>
            </div>
            
            <nav className="flex flex-wrap w-full md:w-auto justify-center gap-2 bg-slate-800 p-1.5 rounded-xl">
              <button onClick={() => { setActiveTab('saved'); setIsCreatingNew(false); }} className={`px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all ${activeTab === 'saved' && !isCreatingNew ? 'bg-red-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                📋 Minhas Fichas ({savedCharacters.length})
              </button>
              <button onClick={() => setActiveTab('rules')} className={`px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all ${activeTab === 'rules' ? 'bg-red-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                📖 Regras Rápidas
              </button>
              <button onClick={() => setActiveTab('world')} className={`px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all ${activeTab === 'world' ? 'bg-red-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                🌍 O Mundo
              </button>
            </nav>
          </header>

          {/* ABA PRINCIPAL 1: MINHAS FICHAS (E CRIADOR EMBUTIDO) */}
          {activeTab === 'saved' && (
            <div>
              {!isCreatingNew ? (
                /* Lista de Personagens Salvos */
                <div className="t20-card p-4 sm:p-6 space-y-4">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-800 pb-4 gap-3">
                    <div>
                      <h2 className="text-xl sm:text-2xl font-black text-red-500">Minhas Fichas de Personagem</h2>
                      <p className="text-xs text-slate-400">Crie, edite e gerencie múltiplos personagens salvos no navegador</p>
                    </div>
                    <button onClick={handleNewCharacter} className="t20-btn-primary w-full sm:w-auto px-4 py-2.5 rounded-lg text-sm font-bold flex items-center justify-center gap-2">
                      <span>➕</span> Criar Novo Personagem
                    </button>
                  </div>

                  {savedCharacters.length === 0 ? (
                    <div className="text-center py-12 bg-slate-900/50 border border-slate-800 rounded-xl space-y-3">
                      <p className="text-slate-400 text-sm">Nenhum personagem criado ainda.</p>
                      <button onClick={handleNewCharacter} className="t20-btn-primary px-4 py-2 rounded-lg text-xs font-bold inline-block">
                        Começar a Criar Ficha
                      </button>
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {savedCharacters.map((char) => (
                        <div key={char.id} className="p-4 bg-slate-900 rounded-xl border border-slate-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                          <div>
                            <h3 className="font-bold text-slate-100 text-lg">{char.name}</h3>
                            <p className="text-xs text-slate-400">
                              {char.selectedRace} - {char.selectedClass}
                              {char.selectedSubChoice ? ` (${char.selectedSubChoice})` : ''} (Nível 1)
                            </p>
                            <div className="text-xs text-slate-500 mt-2 flex gap-4">
                              <span className="text-red-400 font-semibold">PV: {char.totalPV}</span>
                              <span className="text-blue-400 font-semibold">PM: {char.totalPM}</span>
                            </div>
                          </div>
                          <div className="flex w-full sm:w-auto gap-2">
                            <button onClick={() => handleLoadCharacter(char)} className="flex-1 sm:flex-none px-3 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-lg transition-all">
                              ✏️ Abrir / Editar
                            </button>
                            <button onClick={() => handleDeleteCharacter(char.id)} className="px-3 py-2 bg-red-950 hover:bg-red-900 text-red-400 text-xs font-bold rounded-lg border border-red-800 transition-all">
                              🗑️
                            </button>
                          </div>
                        </div>

                                <div className="text-left">
                                  <div className="text-xs font-bold text-slate-200">Pontaria (DES)</div>
                                  <div className="text-[9px] text-amber-400">{COMPETENCY_LEVELS[attackCategories.Pontaria || 0].name}</div>
                                </div>
                                <div className="text-lg font-black text-white">{finalPontaria >= 0 ? `+${finalPontaria}` : finalPontaria}</div>
                              </div>
                            </div>
                            
                            {/* Ataque Básico da Sub-escolha */}
                            {activeSubChoiceObj && (
                              <div className="mt-2 p-2.5 bg-blue-950/40 border border-blue-800/60 rounded-lg text-xs">
                                <span className="font-bold text-blue-300">Ataque de {CLASSES[selectedClass].subChoiceLabel} ({activeSubChoiceObj.attackName}): </span>
                                <span className="text-slate-300">{activeSubChoiceObj.attackDesc}</span>
                              </div>
                            )}
                          </div>

                          {/* Tabela Resumo de Perícias */}
                          <div>
                            <div className="text-xs font-bold text-slate-300 uppercase mb-2">Tabela de Perícias:</div>
                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 bg-slate-900 p-3 rounded-lg border border-slate-800 max-h-40 overflow-y-auto custom-scrollbar">
                              {SKILLS_LIST.map((skill) => {
                                const catLevel = skillCategories[skill.name] || 0;
                                const attrMod = getMod(skill.attr);
                                const profBonus = COMPETENCY_LEVELS[catLevel].bonus;
                                const totalBonus = attrMod + profBonus;

                                return (
                                  <div key={skill.name} className="flex justify-between items-center text-xs p-1 bg-slate-800/40 rounded">
                                    <span className="text-slate-300 truncate">{skill.name}:</span>
                                    <span className="font-bold text-amber-400">{totalBonus >= 0 ? `+${totalBonus}` : totalBonus}</span>
                                  </div>
                                );
                              })}
                            </div>
                          </div>

                          {/* Poderes Escolhidos */}
                          {totalPowersCount > 0 && (
                            <div className="bg-slate-900 p-4 rounded-lg space-y-3">
                              <div className="text-xs font-bold text-amber-400 uppercase border-b border-slate-800 pb-1">Poderes Escolhidos:</div>
                              {Object.entries(selectedPowers).map(([category, ids]) => {
                                if (ids.length === 0) return null;
                                return (
                                  <div key={category} className="space-y-1">
                                    <span className="text-xs font-semibold text-slate-400">🔹 Poderes {category}:</span>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                      {ids.map(id => {
                                        const p = POWERS_DATABASE[category]?.find(x => x.id === id);
                                        return (
                                          <div key={id} className="bg-slate-800 p-2 rounded text-xs border border-slate-700">
                                            <span className="font-bold text-slate-200">{p?.name}: </span>
                                            <span className="text-slate-400">{p?.desc}</span>
                                          </div>
                                        );
                                      })}
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          )}
                        </div>
                      )}
                    </div>

                    {/* Resumo Lateral Responsivo */}
                    <div className="t20-card p-4 sm:p-5 h-fit space-y-3">
                      <h3 className="text-base font-bold text-slate-200 border-b border-slate-800 pb-2">Resumo Rápido</h3>
                      <div className="space-y-2 text-xs sm:text-sm">
                        <div className="flex justify-between"><span className="text-slate-500">Raça:</span> <span className="font-bold text-red-400">{selectedRace}</span></div>
                        <div className="flex justify-between"><span className="text-slate-500">Classe:</span> <span className="font-bold text-red-400">{selectedClass}</span></div>
                        {selectedSubChoice && (
                          <div className="flex justify-between"><span className="text-slate-500">Sub-escolha:</span> <span className="font-bold text-blue-400">{selectedSubChoice}</span></div>
                        )}
                        <div className="flex justify-between"><span className="text-slate-500">PV:</span> <span className="font-bold text-white">{totalPV}</span></div>
                        <div className="flex justify-between"><span className="text-slate-500">PM:</span> <span className="font-bold text-white">{totalPM}</span></div>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* ABA PRINCIPAL 2: REGRAS RÁPIDAS */}
          {activeTab === 'rules' && (
            <div className="space-y-4">
              <h2 className="text-2xl font-bold text-slate-100">Guia Rápido de Regras (Cheat Sheet)</h2>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="t20-card p-4 space-y-2">
                  <h3 className="font-bold text-red-400 text-lg">⚡ Economia de Ações no Combate</h3>
                  <ul className="list-disc list-inside text-xs text-slate-400 space-y-1">
                    <li><strong>1 Ação Padrão:</strong> Atacar, lançar magia.</li>
                    <li><strong>1 Ação de Movimento:</strong> Deslocar-se, sacar arma.</li>
                    <li><strong>Ações Livres:</strong> Falar brevemente.</li>
                    <li><strong>1 Reação:</strong> Usada fora do seu turno.</li>
                  </ul>
                </div>
                <div className="t20-card p-4 space-y-2">
                  <h3 className="font-bold text-blue-400 text-lg">🔮 Limite de Pontos de Mana (PM)</h3>
                  <p className="text-xs text-slate-300">O gasto máximo de PMs em uma única habilidade/magia é igual ao seu Nível de Personagem.</p>
                </div>
              </div>
            </div>
          )}

          {/* ABA PRINCIPAL 3: O MUNDO */}
          {activeTab === 'world' && (
            <div className="t20-card p-4 sm:p-6 space-y-6">
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-800 pb-4 gap-4">
                <div>
                  <h2 className="text-2xl font-black text-red-500">O Mundo</h2>
                  <p className="text-xs text-slate-400">Navegue pelas sub-abas abaixo ou clique nos hyperlinks nos textos</p>
                </div>
                <button onClick={() => setIsEditingLore(!isEditingLore)} className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 rounded border border-slate-700">
                  {isEditingLore ? '💾 Salvar Alterações' : '✏️ Editar Conteúdo do Mundo'}
                </button>
              </div>

              <div className="flex flex-wrap gap-2 bg-slate-900/80 p-2 rounded-lg border border-slate-800">
                {[
                  { id: 'overview', label: '📜 Visão Geral' },
                  { id: 'regioes', label: '🗺️ Regiões' },
                  { id: 'facoes', label: '🛡️ Facções' },
                  { id: 'fatos', label: '✨ Segredos & Fatos' }
                ].map((sub) => (
                  <button
                    key={sub.id}
                    onClick={() => setWorldSubTab(sub.id)}
                    className={`px-3 py-1.5 rounded-md text-xs font-bold transition-all ${worldSubTab === sub.id ? 'bg-red-600 text-white shadow' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>
                    {sub.label}
                  </button>
                ))}
              </div>

              {isEditingLore ? (
                <div className="space-y-4 bg-slate-900 p-4 rounded-lg border border-slate-800">
                  <div className="text-xs font-bold text-amber-400 mb-2">Editando a sub-aba atual: [{worldSubTab}]</div>
                  <div>
                    <label className="text-xs font-bold text-slate-400">Título da Seção:</label>
                    <input type="text" value={worldData[worldSubTab].title} onChange={(e) => { const val = e.target.value; setWorldData(prev => ({...prev, [worldSubTab]: {...prev[worldSubTab], title: val}})); }} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white font-bold mt-1" />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-400">Texto / Lore:</label>
                    <textarea rows={6} value={worldData[worldSubTab].desc} onChange={(e) => { const val = e.target.value; setWorldData(prev => ({...prev, [worldSubTab]: {...prev[worldSubTab], desc: val}})); }} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-200 mt-1 text-sm font-mono" />
                  </div>
                </div>
              ) : (
                <div className="p-5 bg-slate-900/60 border border-slate-800 rounded-lg space-y-4">
                  <h3 className="text-xl font-bold text-red-400">{worldData[worldSubTab].title}</h3>
                  <div className="text-slate-300 leading-relaxed text-sm space-y-2">
                    {renderFormattedText(worldData[worldSubTab].desc)}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
